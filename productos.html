<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos - TiendaAccesorios</title>
    <meta name="description" content="Catálogo de productos de TiendaAccesorios." />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet"/>
  </head>

  <body>
    <header>
      <h1>Tienda de Accesorios 📚</h1>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="index.html#resenas">Reseñas</a></li>
        <li><a href="index.html#contacto">Contacto</a></li>
      </ul>
    </nav>

    <main>
      <section id="productos">
        <h2 class="ph2">Productos</h2>
        <div class="productos-deco">
        </div>
        <div class="productos-furniture">
        </div>
      </section>
    </main>

<script src="js/carrito.js"></script>
<script>
  fetch('https://dummyjson.com/products/category/home-decoration')
    .then(response => response.json())
    .then(data => {
      const productosContainer = document.querySelector('.productos-deco');
      data.products.forEach(producto => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.innerHTML = `
          <img src="${producto.thumbnail}" alt="${producto.title}" />
          <div class="card-body">
            <h3>${producto.title}</h3>
            <p class="descripcion">${producto.description}</p>
            <div class="precio-box">$${producto.price}</div>
          </div>
        `;

        const btnAgregar = document.createElement('button');
        btnAgregar.classList.add('btn-agregar');
        btnAgregar.textContent = 'Agregar al carrito';
        btnAgregar.addEventListener('click', () => {
          agregarAlCarrito({
            id: producto.id,
            title: producto.title,
            price: producto.price,
            thumbnail: producto.thumbnail,
          });
        });
        card.querySelector('.card-body').appendChild(btnAgregar);

        productosContainer.appendChild(card);
      });
    })
    .catch(error => console.error('Error al cargar los productos:', error));
</script>

    <footer>
      <p>TiendaAccesorios © 2026 Leo Page</p>
    </footer>
  </body>
</html>
